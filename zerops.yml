#  Odoo PNX — Zerops deployment
#
#  Two services: the NestJS API and the Next.js web app. The database is Neon,
#  not a Zerops service, so nothing here provisions Postgres — the API just
#  needs DATABASE_URL pointing at it.
#
#  Secrets are NEVER written in this file. Set them once in the Zerops GUI
#  (Service → Environment variables) as secret variables:
#
#    backend   DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
#              R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#              R2_BUCKET_NAME, R2_ENDPOINT
#              (optional) REDIS_URL, RESEND_API_KEY, SENTRY_DSN
#
#  Deploy with:  zcli push
zerops:
  - setup: backend
    build:
      base: nodejs@22
      buildCommands:
        - cd backend && npm ci
        # The Prisma client is generated from the schema, so it must be built
        # before the TypeScript compile that imports its types.
        - cd backend && npx prisma generate
        - cd backend && npm run build
      deployFiles:
        - backend/dist
        - backend/node_modules
        - backend/package.json
        - backend/prisma
      cache:
        - backend/node_modules
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 4000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: '4000'
        # The web app's own Zerops subdomain, so the browser is allowed to call
        # the API. Add your custom domain here too once you have one.
        CORS_ORIGIN: ${frontend_zeropsSubdomain}
        EMAIL_FROM: payroll@odoopnx.com
      initCommands:
        # Applies the schema on first boot and after every schema change. This
        # project has no migration history table (it uses `db push`), so
        # `prisma migrate deploy` would find nothing to run.
        - cd backend && npx prisma db push --skip-generate --accept-data-loss
      start: node backend/dist/main

  - setup: frontend
    build:
      base: nodejs@22
      envVariables:
        # Baked into the client bundle at build time, which is why it lives in
        # the build stage rather than the run stage.
        NEXT_PUBLIC_API_URL: ${backend_zeropsSubdomain}/api/v1
      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build
      deployFiles:
        - frontend/.next
        - frontend/public
        - frontend/node_modules
        - frontend/package.json
        - frontend/next.config.ts
      cache:
        - frontend/node_modules
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: '3000'
        NEXT_PUBLIC_API_URL: ${backend_zeropsSubdomain}/api/v1
      # `next start` serves the App Router build. A static file server cannot:
      # several routes are server-rendered on demand.
      start: cd frontend && npx next start -p 3000
